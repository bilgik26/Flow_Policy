name: libero_all4

# Set false to drop the wrist camera entirely (both from the dataset
# decode and from shape_meta, so the obs_encoder never builds a branch
# for it) — halves per-sample video decode time at the cost of losing
# the wrist camera's close-up/occlusion-robust view. See docs/setup_and_train_libero.md.
use_wrist_image: true

shape_meta:
  obs:
    image:
      shape: [3, 256, 256]
      type: rgb
      horizon: ${n_obs_steps}
    wrist_image:
      shape: [3, 256, 256]
      type: rgb
      horizon: ${n_obs_steps}
    agent_pos:
      shape: [8]
      type: low_dim
      horizon: ${n_obs_steps}
  action:
    shape: [7]

# Combined LIBERO-Spatial + LIBERO-Object + LIBERO-Goal + LIBERO-Long
# (LIBERO's "libero_10" suite is the one commonly called "LIBERO-Long" in
# papers/leaderboards — there is no separate "libero_long" key in
# libero.libero.benchmark.get_benchmark_dict()). task_suite_name itself is
# informational only here; env_runner.suite_names below is what actually
# drives rollouts.
task_suite_name: libero_all4

# Fixed, independent of training.seed -- deterministic per-suite task-level
# train/val split + "seen" eval-task selection, shared by task.dataset and
# task.env_runner below (see maniflow/common/libero_task_split.py). Per
# suite (each has 10 LIBERO tasks): val_tasks_per_suite whole tasks (all
# their episodes) are held out of training entirely and rolled out for the
# "unseen" success-rate metric; seen_tasks_per_suite of the remaining
# trained-on tasks are rolled out for the "seen" success-rate metric.
task_split_seed: 0
val_tasks_per_suite: 2
seen_tasks_per_suite: 2

# One LeRobot dataset root per suite (each itself containing one dataset per
# task, auto-discovered by LiberoImageDataset._discover_lerobot_dirs) — all
# four are loaded and mixed into a single training set.
dataset_base_path:
  - /home/bilgehan.sakai/Flow_Policy/data/libero/datasets/lerobot/libero_spatial
  - /home/bilgehan.sakai/Flow_Policy/data/libero/datasets/lerobot/libero_object
  - /home/bilgehan.sakai/Flow_Policy/data/libero/datasets/lerobot/libero_goal
  - /home/bilgehan.sakai/Flow_Policy/data/libero/datasets/lerobot/libero_10

dataset:
  _target_: maniflow.dataset.libero_dataset.LiberoImageDataset
  dataset_dirs: ${task.dataset_base_path}
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: ${training.seed}
  val_ratio: 0.02   # unused fallback -- val_tasks_per_suite below takes priority
  val_tasks_per_suite: ${task.val_tasks_per_suite}
  task_split_seed: ${task.task_split_seed}
  image_size: 256
  task_name: ${name}
  use_wrist_image: ${task.use_wrist_image}

env_runner:
  _target_: maniflow.env_runner.libero_runner.LiberoRunner
  suite_names: [libero_spatial, libero_object, libero_goal, libero_10]
  val_tasks_per_suite: ${task.val_tasks_per_suite}
  seen_tasks_per_suite: ${task.seen_tasks_per_suite}
  task_split_seed: ${task.task_split_seed}
  # Episodes per task for each metric -- e.g. to bump the "unseen" episode
  # count from the CLI: task.env_runner.unseen_episodes_per_task=50
  seen_episodes_per_task: 10
  unseen_episodes_per_task: 10
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${n_action_steps}
  num_open_loop_steps: 8
  image_size: 256
  num_steps_wait: 10
  max_episode_steps: null    # null -> LiberoEnv.TASK_MAX_STEPS[task_suite_name], per suite
  fps: 20
  tqdm_interval_sec: 1.0
