[project]
name = "flow-policy-robocasa"
version = "0.1.0"
description = "Flow_Policy with RoboCasa support"
requires-python = ">=3.10,<3.11"

# Base dependencies (CPU versions — override with [cu128] extra for GPU)
dependencies = [
    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",
    # Flow_Policy core
    "hydra-core==1.2.0",
    "omegaconf>=2.2",
    "wandb",
    "zarr==2.12.0",
    "einops==0.8.1",
    "timm",
    "transformers==4.46.1",
    "diffusers==0.27.2",
    "accelerate==0.34.2",
    "deepspeed==0.15.1",
    # diffusers==0.27.2 imports huggingface_hub.cached_download, removed in
    # huggingface_hub>=0.26 — pin to the version RoboCasa's .venv already
    # resolved so both venvs stay consistent (see docs/setup_and_train_libero.md
    # troubleshooting: "ImportError: cannot import name 'cached_download'").
    "huggingface_hub==0.25.2",
    # Data / image
    "numpy<2.0",
    "pandas",
    "pyarrow",
    "av",               # PyAV for mp4 decoding
    "decord",           # fast random-access mp4 frame decoding (maniflow/dataset/libero_dataset.py)
    "opencv-python-headless",
    "imageio",
    "imageio-ffmpeg",
    "Pillow",
    # Utils
    "tqdm",
    "termcolor",
    "dill",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "tensorboard",
    # RoboCasa eval
    "mujoco==3.3.1",
    "numba==0.63.1",
    "llvmlite==0.46.0",
    "lerobot",          # for video_utils used by robocasa
    # LIBERO dataset conversion (scripts/convert_libero_to_lerobot.py)
    "h5py",
    # Flash attention (optional, comment out if build fails)
    # "flash-attn",
]

[project.optional-dependencies]
# CUDA 12.8 wheel overrides — used with: uv sync --extra cu128
cu128 = [
    "torch==2.7.0+cu128",
    "torchvision==0.22.0+cu128",
    "torchaudio==2.7.0+cu128",
]
# Optional GPU (NVDEC hardware) video decode backend for
# maniflow/dataset/libero_dataset_dali.py, enabled via
# dataloader.use_dali=true — see docs/setup_and_train_libero.md. A 400+MB
# wheel bundling its own CUDA 12.x runtime libs, kept out of the base
# dependencies since decord (CPU) remains the default. Requires an
# NVDEC-capable NVIDIA GPU.
dali = [
    "nvidia-dali-cuda120",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cu128", extra = "cu128" },
]
torchaudio = [
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
robocasa = [
    # Installed in editable mode via uv pip install -e
    # After uv sync, run:
    #   uv pip install 'robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git'
    #   uv pip install -e robocasa/
    #   uv pip install -e ManiFlow/
]
libero = [
    # LIBERO requires robosuite==1.4.1, which conflicts with RoboCasa's
    # robosuite@main requirement above — install into a SEPARATE venv
    # (.venv-libero), not the default .venv. See docs/setup_and_train_libero.md.
    #   UV_PROJECT_ENVIRONMENT=.venv-libero uv sync --extra cu128 --python 3.10
    #   source .venv-libero/bin/activate
    #   uv pip install 'robosuite==1.4.1'
    #   uv pip install --config-settings editable_mode=compat -e libero/
    #     (plain `-e libero/` fails: setup.py's find_packages() can't see
    #      libero.libero/libero.lifelong because the top "libero" dir has no
    #      __init__.py, so the PEP 660 editable finder gets an empty package
    #      map; `editable_mode=compat` falls back to a classic sys.path .pth
    #      file, which resolves the implicit namespace package correctly)
    #   uv pip install bddl easydict cloudpickle gym
    #   uv pip install -e third_party/r3m   # needed by TimmObsEncoder(model_name='r3m')
    #   uv pip install -e ManiFlow/
]
